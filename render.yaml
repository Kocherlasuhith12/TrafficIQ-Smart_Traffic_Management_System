services:
  # Python FastAPI Backend Web Service
  - type: web
    name: trafficiq-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: YOLO_MODEL_PATH
        value: yolo11n.pt
      - key: DATABASE_URL
        fromDatabase:
          name: trafficiq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trafficiq-redis
          property: connectionString

  # React Static Frontend
  - type: static
    name: trafficiq-frontend
    plan: free
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: trafficiq-backend
          property: url

  # Redis Cache (KeyValue store)
  - type: keyvalue
    name: trafficiq-redis
    plan: free

# PostgreSQL Database
databases:
  - name: trafficiq-db
    plan: free
