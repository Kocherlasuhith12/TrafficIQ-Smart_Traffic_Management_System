services:
  # Python FastAPI Backend Web Service
  - type: web
    name: trafficiq-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: YOLO_MODEL_PATH
        value: yolo11n.pt
      - key: DATABASE_URL
        fromDatabase:
          name: trafficiq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trafficiq-redis
          property: connectionString

  # React Static Frontend
  - type: web
    name: trafficiq-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

  # Redis Cache (KeyValue store)
  - type: keyvalue
    name: trafficiq-redis
    plan: free
    ipAllowList: []

# PostgreSQL Database
databases:
  - name: trafficiq-db
    plan: free
